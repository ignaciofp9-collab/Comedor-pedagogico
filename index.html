<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comedor Pedagógico · IES María Pérez Trujillo</title>
  <meta name="description" content="Web del Comedor Pedagógico del IES María Pérez Trujillo: información del centro, menús semanales en PDF, profesorado y cuadrante de roles." />
  <link rel="icon" href="data:," />
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel (para transpilar JSX en el navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #f3f4f6; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // =============================================
    // Comedor Pedagógico — IES María Pérez Trujillo
    // App React de una sola página. Sin backend.
    // - Persistencia local: localStorage/sessionStorage
    // - Modo edición protegido por login CLIENTE:
    //   ID: Comedor2025  |  Password: Anisaki
    // =============================================

    const { useState, useEffect, useRef, useMemo } = React;

    // --------- Constantes de "seguridad" cliente (no real) ----------
    const AUTH = { id: "Comedor2025", password: "Anisaki" };

    // --------- Helpers de storage ---------
    const STORAGE_KEYS = {
      centerInfo: "mptrujillo.centerInfo.v1",
      gallery: "mptrujillo.gallery.v1",
      menus: "mptrujillo.menus.v1",
      staff: "mptrujillo.staff.v1",
      roster: "mptrujillo.roster.v1",
      editor: "mptrujillo.editor.v1",
    };

    function useLocalStorage(key, initialValue) {
      const [state, setState] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (e) { return initialValue; }
      });
      useEffect(() => {
        try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
      }, [key, state]);
      return [state, setState];
    }

    function useSessionStorage(key, initialValue) {
      const [state, setState] = useState(() => {
        try {
          const item = window.sessionStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (e) { return initialValue; }
      });
      useEffect(() => {
        try { window.sessionStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
      }, [key, state]);
      return [state, setState];
    }

    // --------- Archivos ---------
    const fileToDataURL = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    // --------- Componentes UI ---------
    function Tabs({ tabs, current, onChange }) {
      return (
        <div className="w-full">
          <div className="flex gap-2 mb-6 border-b border-gray-200">
            {tabs.map((t) => (
              <button key={t.id} onClick={() => onChange(t.id)}
                className={`px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${current === t.id ? 'bg-white border border-b-white border-gray-200 -mb-px shadow-sm' : 'bg-gray-50 hover:bg-gray-100 border border-transparent'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function Section({ title, subtitle, children, right }) {
      return (
        <section className="bg-white rounded-2xl shadow p-6 mb-8">
          <div className="flex items-start justify-between gap-4 mb-4">
            <div>
              <h2 className="text-xl font-semibold">{title}</h2>
              {subtitle && <p className="text-sm text-gray-600 mt-1">{subtitle}</p>}
            </div>
            {right}
          </div>
          {children}
        </section>
      );
    }

    function Input({ label, disabled, ...props }) {
      return (
        <label className="block">
          <span className="text-sm text-gray-700">{label}</span>
          <input {...props} disabled={disabled}
            className={`mt-1 w-full rounded-xl border-gray-300 focus:border-gray-400 focus:ring-0 disabled:bg-gray-100 disabled:text-gray-500 ${props.className||''}`} />
        </label>
      );
    }

    function Textarea({ label, disabled, ...props }) {
      return (
        <label className="block">
          <span className="text-sm text-gray-700">{label}</span>
          <textarea {...props} disabled={disabled}
            className={`mt-1 w-full rounded-xl border-gray-300 focus:border-gray-400 focus:ring-0 disabled:bg-gray-100 disabled:text-gray-500 ${props.className||''}`} />
        </label>
      );
    }

    function UploadButton({ accept, onFile, children, disabled }) {
      const ref = useRef();
      return (
        <>
          <button onClick={() => !disabled && ref.current?.click()}
            className={`px-4 py-2 rounded-xl text-white text-sm ${disabled ? 'bg-gray-300 cursor-not-allowed' : 'bg-black hover:opacity-90'}`} disabled={disabled}>
            {children}
          </button>
          <input ref={ref} type="file" accept={accept} className="hidden"
            onChange={async (e) => { if (disabled) return; const f = e.target.files?.[0]; if (f) onFile(f); e.target.value=''; }} />
        </>
      );
    }

    function Badge({ children }) { return (<span className="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[11px] bg-gray-100 border">{children}</span>); }

    // --------- Pestaña 1: Centro ---------
    function Centro({ editable }) {
      const [info, setInfo] = useLocalStorage(STORAGE_KEYS.centerInfo, {
        nombre: "IES María Pérez Trujillo — Comedor Pedagógico",
        direccion: "C. de los Sabandeños, s/n, 38400 Puerto de la Cruz, Santa Cruz de Tenerife",
        telefono: "+34 922 00 00 00",
        email: "info@iesmariapereztrujillo.es",
        historia: "El Comedor Pedagógico es un espacio formativo donde el alumnado aprende en un entorno real de servicio, priorizando el protocolo, la calidad y la atención al cliente.",
        logoDataUrl: null,
      });
      const [gallery, setGallery] = useLocalStorage(STORAGE_KEYS.gallery, []);

      async function onLogo(file) { if (!editable) return; const data = await fileToDataURL(file); setInfo((s) => ({...s, logoDataUrl: data})); }
      async function onAddImage(file) { if (!editable) return; const data = await fileToDataURL(file); setGallery((g) => ([...g, { id: crypto.randomUUID(), dataUrl: data, name: file.name }])); }
      function removeImage(id) { if (!editable) return; setGallery((g) => g.filter((x) => x.id !== id)); }

      return (
        <div className="space-y-6">
          <Section title="Identidad del Centro" subtitle={<span className="flex items-center gap-2">Nombre, logo y datos básicos {!editable && <Badge>Solo lectura</Badge>}</span>}>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-2 space-y-4">
                <Input label="Nombre del centro" value={info.nombre} onChange={(e) => editable && setInfo({...info, nombre: e.target.value})} disabled={!editable} />
                <Textarea rows={4} label="Historia / descripción" value={info.historia} onChange={(e) => editable && setInfo({...info, historia: e.target.value})} disabled={!editable} />
                <Input label="Dirección" value={info.direccion} onChange={(e) => editable && setInfo({...info, direccion: e.target.value})} disabled={!editable} />
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <Input label="Teléfono" value={info.telefono} onChange={(e) => editable && setInfo({...info, telefono: e.target.value})} disabled={!editable} />
                  <Input label="Email" value={info.email} onChange={(e) => editable && setInfo({...info, email: e.target.value})} disabled={!editable} />
                </div>
              </div>
              <div className="space-y-3">
                <div className="aspect-square rounded-2xl border border-dashed grid place-content-center overflow-hidden">
                  {info.logoDataUrl ? (<img src={info.logoDataUrl} alt="Logo" className="object-contain" />) : (<div className="text-center text-sm text-gray-500 p-4">{editable ? 'Sube aquí el logo del centro' : 'Logo no disponible'}</div>)}
                </div>
                <UploadButton accept="image/*" onFile={onLogo} disabled={!editable}>Cambiar logo</UploadButton>
              </div>
            </div>
          </Section>

          <Section title="Galería" subtitle={<span className="flex items-center gap-2">Imágenes del comedor, aulas, eventos {!editable && <Badge>Solo lectura</Badge>}</span>} right={<UploadButton accept="image/*" onFile={onAddImage} disabled={!editable}>Añadir imagen</UploadButton>}>
            {gallery.length === 0 ? (
              <p className="text-sm text-gray-500">Aún no hay imágenes.</p>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {gallery.map((img) => (
                  <div key={img.id} className="relative group">
                    <img src={img.dataUrl} alt={img.name} className="w-full h-40 object-cover rounded-xl shadow" />
                    {editable && (
                      <button onClick={() => removeImage(img.id)} className="absolute top-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-md text-xs shadow opacity-0 group-hover:opacity-100">Eliminar</button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </Section>

          <Section title="Contacto" subtitle="Modo de contacto rápido">
            <div className="flex flex-col md:flex-row gap-4">
              <a className="px-4 py-2 rounded-xl border hover:bg-gray-50" href={`tel:${info.telefono}`}>Llamar: {info.telefono}</a>
              <a className="px-4 py-2 rounded-xl border hover:bg-gray-50" href={`mailto:${info.email}`}>Escribir: {info.email}</a>
              <a className="px-4 py-2 rounded-xl border hover:bg-gray-50" href={`https://maps.google.com/?q=${encodeURIComponent(info.direccion)}`} target="_blank" rel="noreferrer">Cómo llegar</a>
            </div>
          </Section>
        </div>
      );
    }

    // --------- Pestaña 2: Menús ---------
    function Menus({ editable }) {
      const [menus, setMenus] = useLocalStorage(STORAGE_KEYS.menus, []);
      const [label, setLabel] = useState("");
      const [viewer, setViewer] = useState(null);

      async function onUploadPDF(file) {
        if (!editable) return;
        if (!label.trim()) { alert("Añade una etiqueta (p. ej., 'Semana 45 — 2025-11-03')."); return; }
        const dataUrl = await fileToDataURL(file);
        const item = { id: crypto.randomUUID(), label, fileName: file.name, dataUrl, uploadedAt: new Date().toISOString() };
        setMenus((m) => [item, ...m]);
        setLabel("");
      }
      function removeMenu(id) { if (!editable) return; setMenus((m) => m.filter((x) => x.id !== id)); }

      return (
        <div className="space-y-6">
          <Section title="Subir menú semanal (PDF)" subtitle={<span className="flex items-center gap-2">Se archivará con su etiqueta {!editable && <Badge>Solo lectura</Badge>}</span>}>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
              <Input label="Etiqueta de la semana" placeholder="Semana 45 — 2025-11-03" value={label} onChange={(e) => editable && setLabel(e.target.value)} disabled={!editable} />
              <div className="md:col-span-2">
                <UploadButton accept="application/pdf" onFile={onUploadPDF} disabled={!editable}>Subir PDF del menú</UploadButton>
                <p className="text-xs text-gray-500 mt-2">Consejo: incluye la fecha de inicio de semana en la etiqueta. Los PDFs se guardan localmente (este navegador).</p>
              </div>
            </div>
          </Section>

          <Section title="Histórico de menús">
            {menus.length === 0 ? (
              <p className="text-sm text-gray-500">Aún no hay menús subidos.</p>
            ) : (
              <ul className="space-y-3">
                {menus.map((m) => {
                  const menuSrc = m.dataUrl || m.objectUrl || null;
                  const canPreviewInline = Boolean(m.dataUrl);
                  return (
                    <li key={m.id} className="p-4 rounded-xl border flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <div className="font-medium truncate">{m.label}</div>
                        <div className="text-xs text-gray-500 truncate">{m.fileName} • Subido {new Date(m.uploadedAt).toLocaleString()}</div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <button onClick={() => {
                          if (!menuSrc) { alert('No se encontró el archivo. Sube nuevamente el menú.'); return; }
                          if (canPreviewInline) { setViewer(m); }
                          else { window.open(menuSrc, '_blank', 'noopener'); }
                        }}
                          className="px-3 py-1.5 rounded-lg border hover:bg-gray-50 text-sm">Ver</button>
                        <a href={menuSrc || '#'} target="_blank" rel="noreferrer" download={m.fileName}
                          className={`px-3 py-1.5 rounded-lg border hover:bg-gray-50 text-sm ${menuSrc ? '' : 'pointer-events-none opacity-50'}`}>Descargar</a>
                        {editable && (<button onClick={() => removeMenu(m.id)} className="px-3 py-1.5 rounded-lg border hover:bg-gray-50 text-sm">Eliminar</button>)}
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </Section>
          <MenuViewer menu={viewer} onClose={() => setViewer(null)} />
        </div>
      );
    }

    function MenuViewer({ menu, onClose }) {
      if (!menu) return null;
      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl h-[80vh] flex flex-col">
            <div className="flex items-start justify-between gap-4 border-b px-6 py-4">
              <div className="min-w-0">
                <h3 className="text-lg font-semibold truncate">{menu.label}</h3>
                <p className="text-xs text-gray-500 truncate">{menu.fileName}</p>
              </div>
              <button onClick={onClose} className="px-3 py-1.5 rounded-xl border hover:bg-gray-50 text-sm">Cerrar</button>
            </div>
            <div className="flex-1 overflow-hidden p-6">
              <iframe src={menu.dataUrl} title={`Menú ${menu.label}`} className="w-full h-full rounded-xl border" />
            </div>
          </div>
        </div>
      );
    }

    // --------- Pestaña 3: Conócenos + Cuadrante ---------
    const DEFAULT_STAFF = {
      beatriz: { nombre: "Beatriz Cofiño", rol: "Profesora de Sala", foto: null },
      marcos: { nombre: "Marcos Durán", rol: "Profesor de Cocina", foto: null },
    };
    const ROLES = [
      { id: "metre", label: "Maitre" },
      { id: "camarero", label: "Camarero/a" },
      { id: "barista", label: "Barista" },
      { id: "cajero", label: "Cajero/a" },
      { id: "sommelier", label: "Sommelier" },
      { id: "plongeur", label: "Plongeur" },
    ];

    function Conocenos({ editable }) {
      const [staff, setStaff] = useLocalStorage(STORAGE_KEYS.staff, DEFAULT_STAFF);
      const [weekStart, setWeekStart] = useState(() => {
        const d = new Date(); const day = d.getDay(); const diff = (day === 0 ? -6 : 1) - day; d.setDate(d.getDate() + diff); return d.toISOString().slice(0,10);
      });
      const [roster, setRoster] = useLocalStorage(STORAGE_KEYS.roster, {});

      function setFoto(key, dataUrl) { setStaff((s) => ({ ...s, [key]: { ...s[key], foto: dataUrl } })); }
      async function onFotoChange(key, file) { if (!editable) return; const data = await fileToDataURL(file); setFoto(key, data); }

      const currentWeek = roster[weekStart] || {};
      function setAlumno(roleId, value) { if (!editable) return; setRoster((r) => ({ ...r, [weekStart]: { ...(r[weekStart] || {}), [roleId]: value } })); }

      function exportRoster() { const blob = new Blob([JSON.stringify(roster, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'cuadrante_comedor.json'; a.click(); URL.revokeObjectURL(url); }
      function importRoster(file) { if (!editable) return; const reader = new FileReader(); reader.onload = () => { try { const data = JSON.parse(reader.result); setRoster(data); } catch(e) { alert('Archivo inválido'); } }; reader.readAsText(file); }

      return (
        <div className="space-y-6">
          <Section title="Profesorado" subtitle="Sube una foto para cada docente">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {['beatriz','marcos'].map((k) => (
                <div key={k} className="flex items-center gap-4 p-4 border rounded-2xl">
                  <div className="w-20 h-20 rounded-xl overflow-hidden bg-gray-100 grid place-content-center">
                    {staff[k].foto ? (<img src={staff[k].foto} alt={staff[k].nombre} className="w-full h-full object-cover" />) : (<span className="text-xs text-gray-500">Sin foto</span>)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium">{staff[k].nombre}</div>
                    <div className="text-sm text-gray-600">{staff[k].rol}</div>
                    <div className="mt-2">
                      <UploadButton accept="image/*" onFile={(f) => onFotoChange(k, f)} disabled={!editable}>Subir/Actualizar foto</UploadButton>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Section>

          <Section title="Cuadrante semanal" subtitle="Asigna los puestos para la semana seleccionada"
            right={<div className="flex items-center gap-2"><UploadButton accept="application/json" onFile={importRoster} disabled={!editable}>Importar</UploadButton><button onClick={exportRoster} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Exportar</button></div>}>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
              <Input label="Inicio de semana (lunes)" type="date" value={weekStart} onChange={(e) => editable && setWeekStart(e.target.value)} disabled={!editable} />
              <div className="md:col-span-2 text-sm text-gray-500">Consejo: crea una entrada por cada semana lectiva. El cuadrante se guarda automáticamente.</div>
            </div>
            <div className="mt-4 overflow-x-auto">
              <table className="min-w-[480px] w-full border rounded-2xl overflow-hidden">
                <thead>
                  <tr className="bg-gray-50 text-left text-sm">
                    <th className="p-3 border">Puesto</th>
                    <th className="p-3 border">Alumno asignado</th>
                  </tr>
                </thead>
                <tbody>
                  {ROLES.map((r) => (
                    <tr key={r.id} className="hover:bg-gray-50">
                      <td className="p-3 border font-medium">{r.label}</td>
                      <td className="p-3 border">
                        <input type="text" placeholder="Nombre del alumno/a" value={currentWeek[r.id] || ''} onChange={(e) => setAlumno(r.id, e.target.value)} className="w-full rounded-lg border-gray-300 focus:border-gray-400 focus:ring-0 disabled:bg-gray-100 disabled:text-gray-500" disabled={!editable} />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Section>
        </div>
      );
    }

    // --------- Login ---------
    function LoginPanel({ onClose, onSuccess }) {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [err, setErr] = useState("");
      function submit(e){ e.preventDefault(); if(id===AUTH.id && pw===AUTH.password){ onSuccess(); onClose(); } else { setErr('Credenciales incorrectas'); } }
      return (
        <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 grid place-items-center p-4">
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
            <h3 className="text-lg font-semibold mb-4">Entrar en modo edición</h3>
            <form onSubmit={submit} className="space-y-3">
              <Input label="ID" value={id} onChange={(e)=>setId(e.target.value)} />
              <Input label="Password" type="password" value={pw} onChange={(e)=>setPw(e.target.value)} />
              {err && <div className="text-sm text-red-600">{err}</div>}
              <div className="flex items-center justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Cancelar</button>
                <button type="submit" className="px-4 py-2 rounded-xl bg-black text-white">Entrar</button>
              </div>
            </form>
            <p className="mt-3 text-xs text-gray-500">Nota: este login sólo habilita/oculta funciones de edición en este navegador. Para protección real, utiliza autenticación de servidor.</p>
          </div>
        </div>
      );
    }

    // --------- App ---------
    function ComedorPedagogicoApp(){
      const [tab, setTab] = useState('centro');
      const [editorEnabled, setEditorEnabled] = useSessionStorage(STORAGE_KEYS.editor, false);
      const [showLogin, setShowLogin] = useState(false);
      const tabs = [ {id:'centro', label:'Centro'}, {id:'menus', label:'Menús'}, {id:'conocenos', label:'Conócenos'} ];

      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-white sticky top-0 z-10 border-b">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
              <h1 className="text-lg md:text-2xl font-bold">Comedor Pedagógico · IES María Pérez Trujillo</h1>
              <nav className="hidden md:flex items-center gap-2">
                <div className="flex gap-2">
                  {tabs.map((t) => (
                    <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-50 ${tab===t.id?'bg-gray-100':''}`}>{t.label}</button>
                  ))}
                </div>
                <div className="h-6 w-px bg-gray-200 mx-2" />
                {editorEnabled ? (
                  <button onClick={() => setEditorEnabled(false)} className="px-3 py-2 rounded-xl text-sm border hover:bg-gray-50" title="Desactivar modo edición">Salir (edición)</button>
                ) : (
                  <button onClick={() => setShowLogin(true)} className="px-3 py-2 rounded-xl text-sm bg-black text-white hover:opacity-90" title="Activar modo edición">Entrar (edición)</button>
                )}
              </nav>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-6">
            <div className="md:hidden mb-4">
              <Tabs tabs={tabs} current={tab} onChange={setTab} />
              <div className="mt-2">
                {editorEnabled ? (
                  <button onClick={() => setEditorEnabled(false)} className="px-3 py-2 rounded-xl text-sm border w-full">Salir (edición)</button>
                ) : (
                  <button onClick={() => setShowLogin(true)} className="px-3 py-2 rounded-xl text-sm bg-black text-white w-full">Entrar (edición)</button>
                )}
              </div>
            </div>
            {tab==='centro' && <Centro editable={editorEnabled} />}
            {tab==='menus' && <Menus editable={editorEnabled} />}
            {tab==='conocenos' && <Conocenos editable={editorEnabled} />}
          </main>

          <footer className="max-w-6xl mx-auto px-4 pb-10 text-xs text-gray-500">
            <div className="border-t pt-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-2">
              <div>© {new Date().getFullYear()} IES María Pérez Trujillo — Comedor Pedagógico. Todos los derechos reservados.</div>
              <div className="flex items-center gap-2"><span>Hecho con ayuda de ChatGPT.</span>{editorEnabled ? <Badge>Edición activada</Badge> : <Badge>Solo lectura</Badge>}</div>
            </div>
          </footer>

          {showLogin && (<LoginPanel onClose={() => setShowLogin(false)} onSuccess={() => setEditorEnabled(true)} />)}
        </div>
      );
    }
